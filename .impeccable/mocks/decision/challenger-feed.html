<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:390px; height:844px; overflow:hidden; background:#0e0e0e; color:#fff; font-family:Manrope, sans-serif; position:relative; }
  .map { position:absolute; inset:0; background:#1d221f; }
  .map svg { position:absolute; inset:0; }
  .scrim { position:absolute; left:0; right:0; bottom:0; height:340px; background:linear-gradient(transparent, rgba(0,0,0,.85)); }
  .info { position:absolute; left:18px; bottom:96px; right:84px; }
  .info small { font-size:13px; opacity:.85; }
  .info b { display:block; font-size:54px; font-weight:800; letter-spacing:-.02em; margin-top:4px; }
  .info .d { font-size:18px; font-weight:800; color:#ff5a36; }
  .secs { display:flex; gap:6px; margin-top:12px; font-size:12px; }
  .secs span { padding:5px 8px; border-radius:999px; background:rgba(255,255,255,.14); }
  .secs .g { color:#3ddc97; }
  .rail { position:absolute; right:14px; bottom:120px; display:flex; flex-direction:column; gap:22px; text-align:center; font-size:11px; }
  .rail i { display:block; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.16); margin-bottom:4px; }
  nav { position:absolute; bottom:0; left:0; right:0; height:70px; background:#0e0e0e; display:flex; justify-content:space-around; align-items:center; font-size:12px; opacity:.9; }
</style>
</head>
<body>
  <div class="map"><svg viewBox="0 0 390 844"><path d="M150 620 L170 560 L195 520 L215 470 L250 420 L280 370 L275 320 L240 280 L205 250 L180 210 L170 160 L190 120" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg></div>
  <div class="scrim"></div>
  <div class="info">
    <small>Mundial da Santa Marta · Run 07 · 13 set</small>
    <b>3:05.00</b>
    <span class="d">+4.00 s vs Ghost</span>
    <div class="secs"><span>S1 +0.99</span><span class="g">S2 −0.98</span><span>S3 +1.96</span><span>S4 +2.02</span></div>
  </div>
  <div class="rail"><div><i></i>Ghost</div><div><i></i>Vídeo</div><div><i></i>Partilhar</div></div>
  <nav><span>Análise</span><span>Histórico</span><span>Vídeo</span><span>Pistas</span><span>Garagem</span></nav>
</body>
</html>
