<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:390px; height:844px; overflow:hidden; background:#2a2a2a; color:#f2f2f2; font-family:Oswald, sans-serif; }
  .board { margin:46px 10px 0; background:#141414; padding:12px 8px; }
  .head { display:flex; justify-content:space-between; color:#9a9a9a; font-size:12px; letter-spacing:.12em; padding:0 4px 8px; }
  .row { display:grid; grid-template-columns:34px 1fr 74px; gap:4px; margin-bottom:5px; }
  .cell { background:#1f1f1f; border-top:1px solid #333; padding:7px 6px; font-size:17px; text-align:center; position:relative; }
  .cell::after { content:""; position:absolute; left:0; right:0; top:50%; border-top:1px solid #000; }
  .row .name { text-align:left; }
  .row.on .cell { color:#f0a43a; }
  .secs { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:12px 0 0; }
  .secs .cell { font-size:15px; }
  .lost { color:#c6463a !important; }
  .map { margin:12px 10px; height:250px; background:#1b1b1b; position:relative; }
  .map svg { position:absolute; inset:0; }
  nav { position:absolute; bottom:0; left:0; right:0; height:70px; background:#141414; display:flex; justify-content:space-around; align-items:center; font-size:13px; letter-spacing:.06em; color:#9a9a9a; }
  nav .on { color:#f0a43a; }
</style>
</head>
<body>
  <div class="board">
    <div class="head"><span>MUNDIAL DA SANTA MARTA</span><span>13 SET</span></div>
    <div class="row"><div class="cell">1</div><div class="cell name">RUN 05</div><div class="cell">3:01.00</div></div>
    <div class="row"><div class="cell">2</div><div class="cell name">RUN 06</div><div class="cell">3:04.00</div></div>
    <div class="row on"><div class="cell">3</div><div class="cell name">RUN 07 A FUNDO</div><div class="cell">3:05.00</div></div>
    <div class="row"><div class="cell">4</div><div class="cell name">RUN 03</div><div class="cell">3:05.00</div></div>
    <div class="secs"><div class="cell lost">+0.99</div><div class="cell">−0.98</div><div class="cell lost">+1.96</div><div class="cell lost">+2.02</div></div>
  </div>
  <div class="map"><svg viewBox="0 0 370 250"><path d="M160 232 L170 200 L185 185 L200 160 L225 140 L245 118 L242 96 L220 82 L200 70 L180 60 L170 40 L185 22" fill="none" stroke="#f0a43a" stroke-width="4"/></svg></div>
  <nav><span class="on">ANÁLISE</span><span>HISTÓRICO</span><span>VÍDEO</span><span>PISTAS</span><span>GARAGEM</span></nav>
</body>
</html>
