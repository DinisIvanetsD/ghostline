<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --tile:#f6f7f9; --cobalt:#1d3f91; --cobalt-2:#2c58c4; --pale:#dfe5f2; --ochre:#c9782a; --ink:#1b1e24; --muted:#5d6577; }
  * { box-sizing:border-box; margin:0; }
  body { width:390px; height:844px; overflow:hidden; background:var(--tile); color:var(--ink); font-family:"Atkinson Hyperlegible", sans-serif; }
  header { background:var(--cobalt); color:#fff; padding:52px 18px 16px; }
  .brand { font-weight:700; letter-spacing:.08em; font-size:15px; }
  .trail { margin-top:14px; font-size:26px; font-weight:700; }
  .meta { margin-top:4px; font-size:14px; color:#c9d4f0; }
  .runbar { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--pale); font-size:15px; }
  .runbar select { all:unset; font-weight:700; }
  .time { padding:16px 18px 6px; display:flex; align-items:baseline; gap:14px; }
  .time b { font-size:52px; font-variant-numeric:tabular-nums; color:var(--cobalt); letter-spacing:-.01em; }
  .time span { font-size:18px; font-weight:700; color:var(--ochre); }
  .ref { padding:0 18px; font-size:14px; color:var(--muted); }
  .map { margin:14px 18px 0; height:250px; background:#fff; border:2px solid var(--cobalt); position:relative; }
  .map svg { position:absolute; inset:0; }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:14px 18px 0; }
  .t { aspect-ratio:1; border:2px solid var(--cobalt); display:flex; flex-direction:column; justify-content:space-between; padding:7px; font-size:12px; }
  .t b { font-size:16px; font-variant-numeric:tabular-nums; }
  .gain { background:var(--cobalt); color:#fff; }
  .loss { background:#fff; color:var(--ink); box-shadow: inset 0 -16px 0 var(--ochre); }
  .loss b { color:var(--ochre); }
  .worst { padding:14px 18px 0; font-size:15px; }
  .worst b { color:var(--ochre); }
  nav { position:absolute; bottom:0; left:0; right:0; height:74px; background:#fff; border-top:2px solid var(--cobalt); display:grid; grid-template-columns:repeat(5,1fr); text-align:center; font-size:12px; padding-top:12px; color:var(--muted); }
  nav .on { color:var(--cobalt); font-weight:700; }
  nav i { display:block; width:22px; height:22px; margin:0 auto 6px; border:2px solid currentColor; }
</style>
</head>
<body>
  <header>
    <div class="brand">GHOSTLINE</div>
    <div class="trail">Mundial da Santa Marta</div>
    <div class="meta">Santa Marta das Cortiças · 1,14 km · −222 m</div>
  </header>
  <div class="runbar"><select><option>Run 07 · A fundo</option></select><span>vs Ghost · 3:01.00</span></div>
  <div class="time"><b>3:05.00</b><span>+4.00 s</span></div>
  <div class="ref">13 setembro 2026 · Enduro 29 · piso seco</div>
  <div class="map">
    <svg viewBox="0 0 354 250">
      <path d="M150 230 L160 200 L175 185 L190 160 L215 140 L235 118 L232 96 L210 82 L190 70 L170 60 L160 40 L175 22" fill="none" stroke="#dfe5f2" stroke-width="10" stroke-linecap="round"/>
      <path d="M150 230 L160 200 L175 185 L190 160" fill="none" stroke="#c9782a" stroke-width="5" stroke-linecap="round"/>
      <path d="M190 160 L215 140 L235 118 L232 96" fill="none" stroke="#1d3f91" stroke-width="5" stroke-linecap="round"/>
      <path d="M232 96 L210 82 L190 70 L170 60 L160 40 L175 22" fill="none" stroke="#c9782a" stroke-width="5" stroke-linecap="round"/>
      <g font-family="Atkinson Hyperlegible" font-size="12" font-weight="700">
        <rect x="140" y="220" width="20" height="20" fill="#1d3f91"/><text x="146" y="234" fill="#fff">S</text>
        <rect x="165" y="12" width="20" height="20" fill="#1d3f91"/><text x="171" y="26" fill="#fff">F</text>
      </g>
    </svg>
  </div>
  <div class="tiles">
    <div class="t loss"><span>S1 Arranque</span><b>+0.99</b></div>
    <div class="t gain"><span>S2 Íngreme</span><b>−0.98</b></div>
    <div class="t loss"><span>S3 Plano</span><b>+1.96</b></div>
    <div class="t loss"><span>S4 Final</span><b>+2.02</b></div>
  </div>
  <div class="worst">Maior perda: <b>S4 · Descida final +2.02 s</b></div>
  <nav><div class="on"><i></i>Análise</div><div><i></i>Histórico</div><div><i></i>Vídeo</div><div><i></i>Pistas</div><div><i></i>Garagem</div></nav>
</body>
</html>
